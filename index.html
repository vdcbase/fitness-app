<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="ThểDục" />
  <meta name="theme-color" content="#f97316" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />

  <!-- Launch screens cho iOS (thay màn hình đen khi mở app) -->

        media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
  <link rel="apple-touch-startup-image" href="splash/launch-1242x2208.png"
        media="(device-width: 414px) and (device-height: 736px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
  <link rel="apple-touch-startup-image" href="splash/launch-1125x2436.png"
        media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
  <link rel="apple-touch-startup-image" href="splash/launch-828x1792.png"
        media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
  <link rel="apple-touch-startup-image" href="splash/launch-1242x2688.png"
        media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
  <link rel="apple-touch-startup-image" href="splash/launch-1170x2532.png"
        media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
  <link rel="apple-touch-startup-image" href="splash/launch-1284x2778.png"
        media="(device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
  <link rel="apple-touch-startup-image" href="splash/launch-1179x2556.png"
        media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
  <link rel="apple-touch-startup-image" href="splash/launch-1290x2796.png"
        media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
  <link rel="apple-touch-startup-image" href="splash/launch-1206x2622.png"
        media="(device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
  <link rel="apple-touch-startup-image" href="splash/launch-1320x2868.png"
        media="(device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />

  <link rel="stylesheet" href="styles.css" />
  <title>Thể Dục Hàng Ngày</title>
  <style>
    /* Splash hiển thị ngay lập tức, trước cả khi styles.css tải xong */
    #splash {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      background: #f97316;
      transition: opacity .25s ease;
    }
    #splash.hide { opacity: 0; pointer-events: none; }
    #splash .logo { font-size: 64px; }
    #splash .name {
      color: #fff; font-size: 17px; font-weight: 600;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }
    #splash .spinner {
      width: 22px; height: 22px; border-radius: 50%;
      border: 2.5px solid rgba(255,255,255,.35);
      border-top-color: #fff;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="splash">
    <span class="logo">💪</span>
    <span class="name">Thể Dục Hàng Ngày</span>
    <span class="spinner"></span>
  </div>

  <div id="app">
    <!-- Tab content -->
    <main id="main-content">
      <div id="page-today" class="page active"></div>
      <div id="page-weekly" class="page"></div>
      <div id="page-profile" class="page"></div>
    </main>

    <!-- Bottom nav -->
    <nav class="bottom-nav">
      <button class="nav-btn active" data-page="today" onclick="navigate('today')">
        <span class="nav-icon">✅</span>
        <span>Hôm Nay</span>
      </button>
      <button class="nav-btn" data-page="weekly" onclick="navigate('weekly')">
        <span class="nav-icon">📅</span>
        <span>Lịch Tuần</span>
      </button>
      <button class="nav-btn" data-page="profile" onclick="navigate('profile')">
        <span class="nav-icon">👤</span>
        <span>Hồ Sơ</span>
      </button>
    </nav>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
  <script>
    // Ẩn splash ngay khi nội dung đã render
    (function () {
      var splash = document.getElementById('splash');
      function hide() {
        splash.classList.add('hide');
        setTimeout(function () { splash.remove(); }, 250);
      }
      if (document.readyState === 'complete') hide();
      else window.addEventListener('load', hide);
      // Fallback: không để splash kẹt quá 2.5s
      setTimeout(hide, 2500);
    })();

    // Đăng ký service worker sau khi app đã hiện, tránh chặn lần mở đầu
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js');
      });
    }
  </script>
</body>
</html>
